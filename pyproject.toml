[project]
name = "comfyui-grasai"
version = "0.1.0"
description = "Provider-neutral ComfyUI V3 nodes for reference-based image generation and bounded batches"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["aiohttp>=3.11.8", "numpy>=1.25", "Pillow>=10", "torch>=2"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 110
exclude = ["docs/references"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
